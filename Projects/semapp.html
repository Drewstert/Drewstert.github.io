<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senior Sem App</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 5vw;
      background: #ffffff;
      border-bottom: 1px solid #dfe5ee;
    }

    h1 { margin: 0; font-size: 1.25rem; }

    .open-app {
      color: #ffffff;
      background: #2563eb;
      border-radius: 0.5rem;
      padding: 0.65rem 1rem;
      text-decoration: none;
      font-weight: 600;
    }

    main {
      width: min(1400px, 92vw);
      margin: 1.5rem auto;
    }

    .intro { margin-bottom: 1rem; }
    .intro p { margin: 0.35rem 0 0; color: #5c6678; }

    .app-frame {
      width: 100%;
      height: calc(100vh - 10rem);
      min-height: 32rem;
      border: 1px solid #dfe5ee;
      border-radius: 0.75rem;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
    }

    @media (max-width: 600px) {
      header { padding: 1rem 4vw; }
      .open-app { padding: 0.55rem 0.75rem; font-size: 0.9rem; }
      main { width: 92vw; }
      .app-frame { min-height: 36rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Senior Seminar App</h1>
    <a class="open-app" href="https://senior-sem-app.vercel.app" target="_blank" rel="noopener noreferrer">Open in new tab</a>
  </header>

  <main>
    <section class="intro">
      <h2>Senior Seminar Data</h2>
      <p>View the application and data powered by Supabase.</p>
    </section>
    <iframe
      class="app-frame"
      src="https://senior-sem-app.vercel.app"
      title="Senior Seminar Supabase application"
      loading="lazy"
      allow="clipboard-read; clipboard-write">
    </iframe>
  </main>
</body>
</html>
